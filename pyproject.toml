[project]
name = "picx-mcp"
version = "0.1.0"
description = "PicX Studio MCP server — image and video generation tools for any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "Type-Think-AI", email = "support@picxstudio.com" }]
keywords = ["mcp", "model-context-protocol", "fastmcp", "picx", "image-generation"]

# Exact pins throughout. FastMCP's own guidance: "For production use, always pin
# to exact versions." v4 additionally REQUIRES an explicit pin because a default
# install still resolves to 3.x.
dependencies = [
  "fastmcp==4.0.0b3",
  "fastmcp-tasks==4.0.0b3",
  "httpx>=0.28.1",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.7.1",
  "uvicorn[standard]>=0.35",
  "redis==5.2.1",
  # Cyclopts v4 pulls in docutils, whose licensing can trigger compliance review.
  # v5 alpha drops that transitive dependency.
  "cyclopts>=5.0.0a1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "respx==0.22.0",
  "mypy==1.14.1",
  "ruff==0.9.2",
]

[project.urls]
Homepage = "https://picxstudio.com"
Repository = "https://github.com/Type-Think-AI/picx-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
